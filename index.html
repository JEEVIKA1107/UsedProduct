<!DOCTYPE html>
<html>
<head>
    <title>Used Product Marketplace</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<header>
    <h1>UsedMart</h1>
    <p>Buy & Sell Used Products</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#sell">Sell</a>
</nav>

<section id="home" class="home">
    <h2>Find Used Products</h2>
    <input type="text" id="search"
           placeholder="Search product..."
           onkeyup="searchProducts()">
</section>

<section id="products">
    <h2>Available Products</h2>

    <div id="productList">

        <div class="product">
            <h3>Laptop</h3>
            <p>Price: ₹25,000</p>
            <p>Location: Erode</p>
            <button onclick="contactSeller('Laptop')">
                Contact Seller
            </button>
        </div>

        <div class="product">
            <h3>Mobile Phone</h3>
            <p>Price: ₹12,000</p>
            <p>Location: Coimbatore</p>
            <button onclick="contactSeller('Mobile Phone')">
                Contact Seller
            </button>
        </div>

        <div class="product">
            <h3>Bicycle</h3>
            <p>Price: ₹8,000</p>
            <p>Location: Chennai</p>
            <button onclick="contactSeller('Bicycle')">
                Contact Seller
            </button>
        </div>

    </div>
</section>

<section id="sell" class="sell">
    <h2>Sell Your Product</h2>

    <input type="text" id="name"
           placeholder="Product Name">

    <input type="number" id="price"
           placeholder="Price">

    <input type="text" id="location"
           placeholder="Location">

    <button onclick="addProduct()">Post Product</button>
</section>

<footer>
    <p>© 2026 UsedMart</p>
</footer>

<script src="index.js"></script>

</body>
</html>
